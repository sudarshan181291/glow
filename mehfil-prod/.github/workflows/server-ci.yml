name: Server tests
on:
  push: { paths: ['server/**', '.github/workflows/server-ci.yml'] }
  pull_request: { paths: ['server/**'] }
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { TEST_DATABASE_ADMIN_URL: 'postgres://postgres:postgres@127.0.0.1:5432/postgres' }
      - run: npm run build
