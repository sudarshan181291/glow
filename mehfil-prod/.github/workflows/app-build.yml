name: Build Android app

# Builds the sideload APK (Razorpay) and/or the Play Store bundle (Play Billing).
# Settings → Secrets and variables → Actions:
#   Variables: API_URL (e.g. https://api.mehfil.live), EAS_PROJECT_ID (optional, for push)
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Keep the keystore safe: every update must be signed with the same key.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'apk = sideload APK with Razorpay · play = Play Store bundle with Play Billing'
        type: choice
        options: [apk, play]
        default: apk
  push:
    tags: ['app-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      APP_CHANNEL: ${{ github.event.inputs.channel || 'apk' }}
      API_URL: ${{ vars.API_URL }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          if [ -z "$API_URL" ]; then echo "::error::Set the repository variable API_URL (Settings → Secrets and variables → Actions → Variables)"; exit 1; fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then echo "::error::Add the ANDROID_KEYSTORE_* secrets (see README)"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build
        working-directory: app/android
        run: |
          if [ "$APP_CHANNEL" = "play" ]; then TASK=bundleRelease; else TASK=assembleRelease; fi
          ./gradlew $TASK --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Sign
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir -p ../out
          if [ "$APP_CHANNEL" = "play" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab ../out/mehfil-live-play.aab
            zip -q -d ../out/mehfil-live-play.aab 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.MF' || true
            jarsigner -keystore release.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              ../out/mehfil-live-play.aab "${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release.apk aligned.apk
            $BT/apksigner sign --ks release.keystore --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --out ../out/mehfil-live.apk aligned.apk
            $BT/apksigner verify ../out/mehfil-live.apk
          fi
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: mehfil-live-${{ env.APP_CHANNEL }}
          path: out/*
